{{- /* Renders the supported LTS minors from params.lts_versions in hugo.yaml */ -}}
<table>
  <thead>
    <tr><th>Version</th><th>Released</th><th>EOL</th></tr>
  </thead>
  <tbody>
    {{- range site.Params.lts_versions }}
    <tr><td>{{ .version }}</td><td>{{ .released }}</td><td>{{ .eol }}</td></tr>
    {{- end }}
  </tbody>
</table>
