name: 'Deploy Website to Amplify'
description: 'Build Hugo site and deploy to AWS Amplify'
inputs:
  role:
    description: 'AWS IAM role ARN to assume'
    required: true
  region:
    description: 'AWS region for Amplify'
    required: true
  amplify-app-id:
    description: 'AWS Amplify App ID'
    required: true
  amplify-branch-name:
    description: 'AWS Amplify branch name'
    required: true
  s3-bucket:
    description: 'S3 bucket for website files'
    required: true
  s3-prefix:
    description: 'S3 prefix/path for website files'
    required: false
    default: ''
  site-path:
    description: 'Path to the already-rendered site to upload (relative to workspace root). Previews build in a separate unprivileged job and pass the artifact in here.'
    required: false
    default: 'website/public'
runs:
  using: 'composite'
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
        # This step runs in the credentialed deploy job, which only needs to `go run` the redirects
        # script. Restoring a shared build cache into it buys nothing and widens what can reach it.
        cache: false
    - name: Install Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      if: github.event_name == 'push'
      with:
        hugo-version: '0.120.3'
        extended: true
    - name: Build Hugo site (production)
      working-directory: website
      shell: bash
      env:
        HUGO_ENV: production
        HUGO_ENABLEGITINFO: true
        TZ: America/Los_Angeles
        HUGO_CACHEDIR: ${{ github.workspace }}/.hugo
        NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
      if: github.event_name == 'push'
      run: |
        npm ci --prefer-offline
        hugo --gc --minify
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ inputs.region }}
    # Inputs below reach these scripts through env vars rather than being interpolated into the
    # shell: the preview caller derives some of them from a pull request. See .github/security-notice.md
    - name: Upload to S3
      shell: bash
      env:
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_PREFIX: ${{ inputs.s3-prefix }}
        SITE_PATH: ${{ inputs.site-path }}
      run: |
        aws s3 sync "$SITE_PATH/" "s3://$S3_BUCKET/$S3_PREFIX" --delete --no-follow-symlinks
    - name: Create Amplify branch (if preview and doesn't exist)
      shell: bash
      if: github.event_name == 'workflow_run'
      env:
        AMPLIFY_APP_ID: ${{ inputs.amplify-app-id }}
        AMPLIFY_BRANCH_NAME: ${{ inputs.amplify-branch-name }}
      run: |
        if ! aws amplify get-branch --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH_NAME" 2>/dev/null; then
          aws amplify create-branch \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH_NAME"
        fi
    - name: Configure redirects
      shell: bash
      env:
        AMPLIFY_APP_ID: ${{ inputs.amplify-app-id }}
      run: |
        # Always the base repo's script and content - it rewrites rules on the shared Amplify app
        REDIRECT_RULES=$(go run ./hack/docs/parse-redirects/main.go)
        aws amplify update-app \
          --app-id "$AMPLIFY_APP_ID" \
          --custom-rules "$REDIRECT_RULES"
    - name: Deploy to Amplify
      shell: bash
      env:
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_PREFIX: ${{ inputs.s3-prefix }}
        AMPLIFY_APP_ID: ${{ inputs.amplify-app-id }}
        AMPLIFY_BRANCH_NAME: ${{ inputs.amplify-branch-name }}
      run: |
        aws amplify start-deployment \
          --app-id "$AMPLIFY_APP_ID" \
          --branch-name "$AMPLIFY_BRANCH_NAME" \
          --source-url "s3://$S3_BUCKET/$S3_PREFIX" \
          --source-url-type BUCKET_PREFIX
