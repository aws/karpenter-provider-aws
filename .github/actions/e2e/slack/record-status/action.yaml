name: SlackRecordStatus
description: 'Records a suite pass/fail as an artifact so the matrix run can post a single summary'
inputs:
  suite:
    description: "Suite that's running"
    required: true
  infra:
    description: "Whether a failure happened in cluster setup, before Karpenter was installed. Recorded as 'infra' instead of 'failure'"
    default: 'false'
  infra_signature:
    description: "Cause of an infra failure (iam-roles-quota, oidc-quota, cfn-throttle or other). Recorded as 'infra:<signature>'"
    default: ''
runs:
  using: "composite"
  steps:
    - id: record
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        INFRA: ${{ inputs.infra }}
        INFRA_SIGNATURE: ${{ inputs.infra_signature }}
      run: |
        mkdir -p suite-status
        STATUS="failure"
        if [[ "${{ job.status }}" == "success" ]]; then
          STATUS="success"
        elif [[ "$INFRA" == "true" ]]; then
          STATUS="infra:${INFRA_SIGNATURE:-other}"
        fi
        # Filename is the lowercased suite name; contents are success|failure|infra:<signature>
        echo "$STATUS" > "suite-status/${SUITE,,}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-status-${{ inputs.suite }}
        path: suite-status/
        retention-days: 1
