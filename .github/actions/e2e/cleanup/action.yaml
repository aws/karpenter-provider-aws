name: Cleanup
description: 'Runs all the cleanup tasks to cleanup resources deployed during E2E'
inputs:
  account_id:
    description: "Account ID to access AWS"
    required: true
  role:
    description: "Role to access AWS"
    required: true
  region:
    description: "Region to access AWS"
    required: true
  cluster_name:
    description: 'Name of the cluster to be launched by eksctl'
    required: true
  git_ref:
    description: "The git commit, tag, or branch to check out. Requires a corresponding Karpenter snapshot release"
  eksctl_version:
    description: "Version of eksctl to install"
    default: v0.217.0
  private_cluster:
    description: "Whether the cluster that has to be deleted is private or not. Valid values are 'true' or 'false'"
    default: 'false'
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.git_ref }}
    - uses: ./.github/actions/e2e/install-eksctl
      with:
        version: ${{ inputs.eksctl_version }}
    - name: delete-cluster
      if: ${{ inputs.private_cluster == 'false' }}
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster_name }}
      run: |
        eksctl delete cluster --name "$CLUSTER_NAME" --timeout 60m --wait || true
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: test/hack/resource/go.mod
        cache-dependency-path: test/hack/resource/go.sum
        check-latest: true
        cache: false
    - name: "Run cleanup script"
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster_name }}
      run: |
        go run main.go --cluster-name "$CLUSTER_NAME"
      working-directory: ./test/hack/resource/clean
    # The cleanup script finds stacks by tag and calls DeleteStack once without waiting. This goes by name and waits.
    # Runs last so the script has removed the instance profiles that hold the stack's node role.
    - name: delete iam stack
      if: always()
      shell: bash
      env:
        STACK_NAME: iam-${{ inputs.cluster_name }}
        AWS_RETRY_MODE: standard
        AWS_MAX_ATTEMPTS: "10"
      run: |
        if ! status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].StackStatus" --output text 2>&1); then
          if [[ "$status" != *"does not exist"* ]]; then
            echo "::warning::Could not describe $STACK_NAME: $status"
          fi
          exit 0
        fi
        # DeleteStack can be rejected while an operation is in progress, e.g. a cancelled setup
        for _ in {1..40}; do
          [[ "$status" == *_IN_PROGRESS && "$status" != REVIEW_IN_PROGRESS && "$status" != DELETE_IN_PROGRESS ]] || break
          sleep 15
          status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].StackStatus" --output text 2>&1 || true)
        done
        echo "Deleting $STACK_NAME from $status"
        if ! aws cloudformation delete-stack --stack-name "$STACK_NAME" || ! aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"; then
          status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].StackStatus" --output text 2>&1 || true)
          echo "::warning::$STACK_NAME was not deleted: $status"
        fi
