name: PreviewComment
# Producer for /karpenter preview only. Kept separate from ApprovalComment so that WebsitePreviewPR,
# which triggers on this workflow, is the only thing a preview request can reach - a preview cannot
# start a snapshot or an E2E suite, and those commands cannot start a deploy to the preview Amplify
# app. See .github/workflows/approval-metadata.yaml
on:
  pull_request_review:
    types: [submitted]
# The membership check and artifact upload in approval-metadata.yaml need no GITHUB_TOKEN scopes
permissions: {}
jobs:
  preview-comment:
    if: github.repository == 'aws/karpenter-provider-aws' && startsWith(github.event.review.body, '/karpenter preview')
    uses: ./.github/workflows/approval-metadata.yaml
