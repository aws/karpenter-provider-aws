name: E2EUpgrade
on:
  workflow_dispatch:
    inputs:
      from_git_ref:
        description: "Git ref to upgrade from. Defaults to the latest release"
        type: string
      region:
        type: choice
        options:
          - "us-east-2"
          - "us-west-2"
        default: "us-east-2"
      to_git_ref:
        type: string
      k8s_version:
        type: choice
        options:
          - "1.30"
          - "1.31"
          - "1.32"
          - "1.33"
          - "1.34"
          - "1.35"
          - "1.36"
        default: "1.36"
      cleanup:
        required: true
        default: true
        type: boolean
      source:
        type: string
        default: "aws" 
  workflow_call:
    inputs:
      from_git_ref:
        description: "Git ref to upgrade from. Defaults to the latest release"
        type: string
      to_git_ref:
        type: string
      region:
        type: string
        default: "us-east-2"
      k8s_version:
        type: string
        default: "1.36"
      cleanup:
        required: true
        type: boolean
      workflow_trigger:
        type: string
      source:
        type: string
        default: "aws" 
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
jobs:
  run-suite:
    permissions:
      contents: read # gh release view
      id-token: write # aws-actions/configure-aws-credentials@v4.0.1
      statuses: write # ./.github/actions/commit-status/start
    name: suite-upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.to_git_ref }}
      - if: always() && github.event_name == 'workflow_run'
        uses: ./.github/actions/commit-status/start
        with:
          name: ${{ github.workflow }} (${{ inputs.k8s_version }}) / e2e (Upgrade)
          git_ref: ${{ inputs.to_git_ref }}
      - uses: ./.github/actions/install-deps
      - id: resolve-from-git-ref
        name: resolve from_git_ref
        env:
          FROM_GIT_REF: ${{ inputs.from_git_ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "$FROM_GIT_REF" ]]; then
            FROM_GIT_REF=$(gh release view --repo "$REPOSITORY" --json tagName --jq .tagName)
          fi
          if [[ -z "$FROM_GIT_REF" ]]; then
            echo "::error::unable to resolve the latest release of $REPOSITORY"
            exit 1
          fi
          echo "Upgrading from \"$FROM_GIT_REF\""
          echo FROM_GIT_REF="$FROM_GIT_REF" >> "$GITHUB_OUTPUT"
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/${{ vars.CI_ROLE_NAME }}
          aws-region: ${{ inputs.region }}
          role-duration-seconds: 21600
      - id: generate-cluster-name
        name: generate cluster name
        run: |
          CLUSTER_NAME="upgrade-$RANDOM$RANDOM"
          echo "Using cluster name \"$CLUSTER_NAME\""
          echo CLUSTER_NAME="$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
      - name: setup eks cluster '${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}'
        uses: ./.github/actions/e2e/setup-cluster
        with:
          account_id: ${{ vars.CI_ACCOUNT_ID }}
          role: ${{ vars.CI_ROLE_NAME }}
          region: ${{ inputs.region }}
          cluster_name: ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}
          k8s_version: ${{ inputs.k8s_version }}
          eksctl_version: v0.217.0
          ip_family: IPv4 # Set the value to IPv6 if IPv6 suite, else IPv4
          # Build the cluster with this ref's eksctl config and IAM so it already has what the upgraded Karpenter needs
          # (e.g. zonal shift), and only install Karpenter from the from-ref
          git_ref: ${{ inputs.to_git_ref }}
          karpenter_git_ref: ${{ steps.resolve-from-git-ref.outputs.FROM_GIT_REF }}
          ecr_account_id: ${{ vars.SNAPSHOT_ACCOUNT_ID }}
          ecr_region: ${{ vars.SNAPSHOT_REGION }}
          prometheus_workspace_id: ${{ vars.WORKSPACE_ID }}
          prometheus_region: ${{ vars.PROMETHEUS_REGION }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.to_git_ref }}
      - name: upgrade crds
        uses: ./.github/actions/e2e/upgrade-crds
        with:
          account_id: ${{ vars.CI_ACCOUNT_ID }}
          role: ${{ vars.CI_ROLE_NAME }}
          region: ${{ inputs.region }}
          cluster_name: ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}
          git_ref: ${{ inputs.to_git_ref }}
      - name: upgrade eks cluster '${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}'
        uses: ./.github/actions/e2e/setup-cluster
        with:
          account_id: ${{ vars.CI_ACCOUNT_ID }}
          role: ${{ vars.CI_ROLE_NAME }}
          region: ${{ inputs.region }}
          cluster_name: ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}
          k8s_version: ${{ inputs.k8s_version }}
          eksctl_version: v0.217.0
          ip_family: IPv4 # Set the value to IPv6 if IPv6 suite, else IPv4
          git_ref: ${{ inputs.to_git_ref }}
          ecr_account_id: ${{ vars.SNAPSHOT_ACCOUNT_ID }}
          ecr_region: ${{ vars.SNAPSHOT_REGION }}
          prometheus_workspace_id: ${{ vars.WORKSPACE_ID }}
          prometheus_region: ${{ vars.PROMETHEUS_REGION }}
      - name: run the Upgrade test suite
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          aws eks update-kubeconfig --name ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}

          if [[ "$SOURCE" == 'aws' ]]; then
          CLUSTER_NAME=${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }} INTERRUPTION_QUEUE=${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }} CLUSTER_ENDPOINT="$(aws eks describe-cluster --name ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }} --query "cluster.endpoint" --output text)" TEST_SUITE="Integration" make e2etests
          elif [[ "$SOURCE" == 'upstream' ]]; then
            FOCUS="Integration" CLUSTER_NAME="${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}" make upstream-e2etests
          elif [[ "$SOURCE" == 'all' ]]; then
            CLUSTER_NAME=${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }} INTERRUPTION_QUEUE=${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }} CLUSTER_ENDPOINT="$(aws eks describe-cluster --name ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }} --query "cluster.endpoint" --output text)" TEST_SUITE="Integration" make e2etests
            FOCUS="Integration" CLUSTER_NAME="${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}" make upstream-e2etests
          fi
      - name: notify slack of success or failure
        uses: ./.github/actions/e2e/slack/notify
        # The matrix run posts a single summary message (see e2e-matrix.yaml), so skip the per-suite ping there
        if: (success() || failure()) && github.event_name != 'workflow_run' && inputs.workflow_trigger != 'versionCompatibility' && inputs.workflow_trigger != 'matrix'
        with:
          cluster_name:  ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}
          url: ${{ secrets.SLACK_WEBHOOK_URL }}
          suite: Upgrade
          git_ref: ${{ inputs.to_git_ref }}
      - name: record suite status for the matrix run summary
        uses: ./.github/actions/e2e/slack/record-status
        if: (success() || failure()) && inputs.workflow_trigger == 'matrix'
        with:
          suite: Upgrade
      - name: dump logs on failure
        uses: ./.github/actions/e2e/dump-logs
        if: failure() || cancelled()
        with:
          account_id: ${{ vars.CI_ACCOUNT_ID }}
          role: ${{ vars.CI_ROLE_NAME }}
          region: ${{ inputs.region }}
          cluster_name: ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}
      - name: cleanup karpenter and cluster '${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}' resources
        uses: ./.github/actions/e2e/cleanup
        if: always() && inputs.cleanup
        with:
          account_id: ${{ vars.CI_ACCOUNT_ID }}
          role: ${{ vars.CI_ROLE_NAME }}
          region: ${{ inputs.region }}
          cluster_name: ${{ steps.generate-cluster-name.outputs.CLUSTER_NAME }}
          git_ref: ${{ inputs.to_git_ref }}
          eksctl_version: v0.217.0
      - if: always() && github.event_name == 'workflow_run'
        uses: ./.github/actions/commit-status/end
        with:
          name: ${{ github.workflow }} (${{ inputs.k8s_version }}) / e2e (Upgrade)
          git_ref: ${{ inputs.to_git_ref }}
