name: WebsitePreviewTrigger
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths: [ website/** ]
# A new push to a pull request cancels that pull request's in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Renders the pull request's site so that WebsitePreviewPR can ship it when a maintainer asks for
  # a preview. This has to stay on `pull_request`: the job runs the pull request's own code, and on
  # that trigger a fork gets a fork-scoped token and a `refs/pull/N/merge` cache scope, so nothing it
  # writes is reachable from the default branch. Building it from a `workflow_run` workflow instead
  # would hand that code the base repository's default-branch cache scope.
  # https://gh.io/securely-using-pull_request_target
  preview-trigger:
    runs-on: ubuntu-latest
    if: github.repository == 'aws/karpenter-provider-aws'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Preview the PR head, not the merge commit checkout defaults to, so that the preview, the
          # commit status and the "built from commit" comment all describe the same commit. The
          # deploy workflow finds this run by that same head SHA.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: website/go.mod
          check-latest: true
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.120.3'
          extended: true
      - name: Build the site for the deploy workflow to ship
        working-directory: website
        env:
          HUGO_ENV: production
          HUGO_ENABLEGITINFO: true
          TZ: America/Los_Angeles
          HUGO_CACHEDIR: ${{ github.workspace }}/.hugo
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
        run: |
          npm ci --prefer-offline
          hugo --gc --minify --buildFuture -d /tmp/site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-preview-site
          path: /tmp/site
          # A maintainer has to ask for the preview, which can be days after the push, so this has to
          # outlive the review. Past this window /karpenter preview reports that the build expired
          # and the author needs to push again.
          retention-days: 14
