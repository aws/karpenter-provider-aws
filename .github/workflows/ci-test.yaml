name: CI-TEST
on:
  push:
    branches:
      - 'release-v*'
      - 'staging/*'
  pull_request:
  # The merge queue tests the exact commit that lands on main, so pushes to main don't rerun these.
  merge_group:
  workflow_dispatch:
# A new push to a pull request cancels that pull request's in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci-test:
    runs-on: ubuntu-latest
    if: github.repository == 'aws/karpenter-provider-aws'
    strategy:
        fail-fast: false
        matrix:
          k8sVersion: ["1.30.x", "1.31.x", "1.32.x", "1.33.x", "1.34.x", "1.35.x", "1.36.x"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/install-deps
      with:
        k8sVersion: ${{ matrix.k8sVersion }}
    - run: K8S_VERSION=${{ matrix.k8sVersion }} make ci-test
    - name: Send coverage
      # should only send converage once https://docs.coveralls.io/parallel-builds
      if: matrix.k8sVersion == '1.36.x'
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: goveralls -coverprofile=coverage.out -service=github
