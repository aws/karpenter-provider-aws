name: Sweeper
on:
  schedule:
    # Run between the scheduled E2E matrix runs, not on top of them. The us-east-2 cleanup issues
    # DeleteStack for every expired stack and can saturate the CloudFormation concurrent operation
    # limit for ~20 minutes, which fails cluster setup for any E2E run starting in that window.
    # The matrix ('7 */8 * * *' in e2e-matrix-trigger.yaml) usually starts 5-80 minutes after its
    # cron (up to ~2h observed) and runs for ~3.5-4.5h, so it typically occupies 00:30-04:50,
    # 08:10-12:40 and 16:10-20:45 UTC. 05:30 and 13:30 sit mid-gap: clear of slow 00:xx runs that
    # end as late as ~05:25, and ~1.5h before the next matrix start. They also stay clear of the
    # perf, scale (us-west-2) and private cluster (us-east-1) schedules. Re-check this slot if any
    # of those crons change.
    - cron: '30 5,13 * * *'
  workflow_dispatch:
jobs:
  sweeper:
    permissions:
      id-token: write # aws-actions/configure-aws-credentials@v4.0.1
    if: vars.CI_ACCOUNT_ID != '' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region: [us-east-2, us-west-2, eu-west-1, eu-north-1, us-east-1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/${{ vars.CI_ROLE_NAME }}
          aws-region: ${{ matrix.region }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/hack/resource/go.mod
          check-latest: true
          cache-dependency-path: "test/hack/resource/go.sum"
      # eu-north-1 contains the soak tests and resources should be swept if they are older than 8 days
      - run: |
          if [[ "${{ matrix.region }}" == "eu-north-1" ]]; then
            go run main.go --expiration 192h
          else
            go run main.go --expiration 12h
          fi
        working-directory: ./test/hack/resource/clean
        name: "Run cleanup script"
