name: ApprovalComment
# Producer for the commands that build and publish the pull request's own code. /karpenter preview is
# deliberately NOT here - it has its own producer (PreviewComment) so that asking for a docs preview
# cannot reach the snapshot or E2E pipelines. See .github/workflows/approval-metadata.yaml
on:
  pull_request_review:
    types: [submitted]
# The membership check and artifact upload in approval-metadata.yaml need no GITHUB_TOKEN scopes
permissions: {}
jobs:
  approval-comment:
    if: |
      startsWith(github.event.review.body, '/karpenter snapshot') ||
      startsWith(github.event.review.body, '/karpenter scale') ||
      startsWith(github.event.review.body, '/karpenter versionCompatibility')
    uses: ./.github/workflows/approval-metadata.yaml
