name: Deploy Website Preview to Amplify
on:
  workflow_run:
    workflows: [ WebsitePreviewTrigger ]
    types: [ completed ]
jobs:
  # WebsitePreviewTrigger already built the site in the PR's own context. This job holds the
  # Amplify role and a write token, so it only ever runs base repository code - it must not
  # check out or execute anything from the PR. https://gh.io/securely-using-pull_request_target
  preview:
    # A failed trigger means the PR's site never built, so there is nothing to ship and the
    # error already surfaced on the PR's own check
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/download-artifact
      # WebsitePreviewTrigger builds the PR's own site, so the PR can run arbitrary code there and
      # rewrite the metadata artifact after it is written. Take the commit from the event payload,
      # which the PR cannot influence, and trust the PR number only once GitHub confirms that PR
      # actually owns that commit - otherwise a PR could deploy over, comment on, or set a commit
      # status against any other PR. See .github/security-notice.md
      - id: website-metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_ID: ${{ vars.AMPLIFY_APP_ID_PREVIEW }}
        with:
          script: |
            const claimed = require('fs')
              .readFileSync('/tmp/artifacts/website-metadata.txt', 'utf8')
              .split('\n')[0].trim();
            if (!/^[0-9]+$/.test(claimed)) {
              core.setFailed(`malformed PR number in artifact: ${JSON.stringify(claimed)}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(claimed),
            });
            if (pr.head.sha !== process.env.HEAD_SHA) {
              core.setFailed(
                `PR #${claimed} is at ${pr.head.sha}, but this run built ${process.env.HEAD_SHA}`
              );
              return;
            }
            core.exportVariable('PR_NUMBER', claimed);
            core.exportVariable('PR_COMMIT', process.env.HEAD_SHA);
            core.exportVariable('BRANCH_NAME', `pr-${claimed}`);
            core.exportVariable(
              'PREVIEW_URL', `https://pr-${claimed}.${process.env.APP_ID}.amplifyapp.com`
            );
      - uses: ./.github/actions/commit-status/start
        with:
          name: "${{ github.workflow }} / ${{ github.job }} (pull_request_review)"
          git_ref: ${{ env.PR_COMMIT }}
      - name: Deploy website
        uses: ./.github/actions/deploy-website
        with:
          role: arn:aws:iam::${{ vars.RELEASE_PREVIEW_ACCOUNT_ID }}:role/${{ vars.WEBSITE_ROLE_NAME }}
          region: ${{ vars.AMPLIFY_REGION }}
          amplify-app-id: ${{ vars.AMPLIFY_APP_ID_PREVIEW }}
          amplify-branch-name: ${{ env.BRANCH_NAME }}
          s3-bucket: ${{ vars.AMPLIFY_S3_BUCKET_BETA }}
          s3-prefix: pr-${{ env.PR_NUMBER }}/
          site-path: /tmp/artifacts/site
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PR_COMMIT: ${{ env.PR_COMMIT }}
        with:
          script: |
            const commentBody = `**Preview deployment ready!**
            
            **Preview URL:** ${process.env.PREVIEW_URL}
            
            Built from commit \`${process.env.PR_COMMIT}\``;
            
            const existingComment = (await github.rest.issues.listComments({
              issue_number: process.env.PR_NUMBER,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })).data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('**Preview deployment ready!**')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: process.env.PR_NUMBER,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }
      - if: always()
        uses: ./.github/actions/commit-status/end
        with:
          name: "${{ github.workflow }} / ${{ github.job }} (pull_request_review)"
          git_ref: ${{ env.PR_COMMIT }}
