name: E2EPrivateClusterTrigger
on:
  schedule:
    - cron: '7 0 * * 4'
  workflow_dispatch:
# Runs share the CodeBuild VPC's 192.168.0.0/16 route, so a manual run must not overlap a scheduled one
concurrency:
  group: e2e-private-cluster
  cancel-in-progress: false
jobs:
  private-cluster-trigger:
    if: github.repository == 'aws/karpenter-provider-aws'
    permissions:
      id-token: write # aws-actions/configure-aws-credentials@v4.0.1
      statuses: write # ./.github/actions/commit-status/start
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Integration
      region: us-east-1
      workflow_trigger: "private_cluster"
      cleanup: true
      codebuild_region: US_EAST_1
      source: aws
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
